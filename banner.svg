<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5ed7"/>
      <stop offset="0.55" stop-color="#1f8fd6"/>
      <stop offset="1" stop-color="#3fae5a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .trace{fill:none;stroke:#fff;stroke-opacity:.28;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .pad{fill:#fff;fill-opacity:.4}
      .pulse{fill:#fff;animation:blink 2.4s ease-in-out infinite}
      .p2{animation-delay:.8s}.p3{animation-delay:1.6s}
      @keyframes blink{0%,100%{opacity:.15}50%{opacity:.9}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- circuit traces, left -->
  <path class="trace" d="M0 70 H70 L100 100 H170"/>
  <path class="trace" d="M0 150 H120 L150 120 H200"/>
  <path class="trace" d="M0 230 H60 L90 200 H150 L180 230 H230"/>
  <circle class="pad" cx="170" cy="100" r="6"/><circle class="pad" cx="200" cy="120" r="6"/><circle class="pad" cx="230" cy="230" r="6"/>
  <circle class="pulse" cx="170" cy="100" r="3"/><circle class="pulse p2" cx="200" cy="120" r="3"/><circle class="pulse p3" cx="230" cy="230" r="3"/>

  <!-- circuit traces, right -->
  <path class="trace" d="M1200 60 H1120 L1090 90 H1030"/>
  <path class="trace" d="M1200 160 H1080 L1050 190 H990"/>
  <path class="trace" d="M1200 245 H1140 L1110 215 H1060"/>
  <circle class="pad" cx="1030" cy="90" r="6"/><circle class="pad" cx="990" cy="190" r="6"/><circle class="pad" cx="1060" cy="215" r="6"/>
  <circle class="pulse p2" cx="1030" cy="90" r="3"/><circle class="pulse p3" cx="990" cy="190" r="3"/><circle class="pulse" cx="1060" cy="215" r="3"/>

  <!-- heartbeat line (biomedical) -->
  <path d="M330 232 H520 L540 232 L555 205 L572 258 L590 214 L604 232 H870" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="600" y="128" text-anchor="middle" font-size="62" font-weight="700" fill="#ffffff">Chiara Mancarella</text>
  <text x="600" y="176" text-anchor="middle" font-size="24" fill="#eaf4ff">Automation Engineering · Embedded Systems · Biomedical Tech</text>
</svg>
